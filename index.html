<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>砂粒のじかん</title>
  <style>
    :root {
      --sand: #d4a76a;
      --sand-light: #f0dbb8;
      --sand-dark: #a67c4a;
      --glass: #e8e4df;
      --bg: #faf6f0;
      --text: #4a3f35;
      --text-light: #8a7e72;
      --accent: #c4956a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      width: 100%;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--sand-dark);
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.3rem;
      letter-spacing: 0.1em;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 0 1.2rem 2rem;
      flex: 1;
    }

    /* --- Tabs --- */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--sand-light);
    }

    .tab {
      flex: 1;
      padding: 0.7rem;
      text-align: center;
      background: none;
      border: none;
      font-size: 0.9rem;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
      font-family: inherit;
    }

    .tab.active {
      color: var(--sand-dark);
      border-bottom-color: var(--sand-dark);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* --- Timer Panel --- */
    .activity-input-area {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .activity-input {
      width: 100%;
      max-width: 300px;
      padding: 0.7rem 1rem;
      border: 1px solid var(--sand-light);
      border-radius: 2rem;
      background: white;
      font-size: 1rem;
      text-align: center;
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    .activity-input:focus {
      border-color: var(--sand);
    }

    .activity-input::placeholder {
      color: var(--text-light);
      font-size: 0.85rem;
    }

    /* --- Hourglass --- */
    .hourglass-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 1.5rem 0;
    }

    .hourglass {
      position: relative;
      width: 120px;
      height: 200px;
    }

    .hourglass svg {
      width: 100%;
      height: 100%;
    }

    .sand-count {
      text-align: center;
      margin-top: 1rem;
    }

    .sand-count .number {
      font-size: 2.5rem;
      font-weight: 300;
      color: var(--sand-dark);
      letter-spacing: 0.05em;
    }

    .sand-count .unit {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-left: 0.2rem;
    }

    .elapsed-time {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.3rem;
    }

    /* --- Timer Controls --- */
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 2rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      letter-spacing: 0.1em;
    }

    .btn-start {
      background: var(--sand);
      color: white;
    }

    .btn-start:hover {
      background: var(--sand-dark);
    }

    .btn-start:disabled {
      background: var(--sand-light);
      cursor: not-allowed;
    }

    .btn-pause {
      background: var(--glass);
      color: var(--text);
    }

    .btn-pause:hover {
      background: #d8d4cf;
    }

    .btn-stop {
      background: var(--accent);
      color: white;
    }

    .btn-stop:hover {
      background: #b08058;
    }

    .btn-save {
      background: var(--sand-dark);
      color: white;
    }

    .btn-save:hover {
      background: #8a6438;
    }

    .timer-state-idle .running-controls,
    .timer-state-idle .stopped-controls {
      display: none;
    }

    .timer-state-running .idle-controls,
    .timer-state-running .stopped-controls {
      display: none;
    }

    .timer-state-paused .idle-controls,
    .timer-state-paused .stopped-controls {
      display: none;
    }

    .timer-state-stopped .idle-controls,
    .timer-state-stopped .running-controls {
      display: none;
    }

    /* --- History Panel --- */
    .history-summary {
      text-align: center;
      padding: 1rem;
      margin-bottom: 1rem;
      background: white;
      border-radius: 1rem;
      border: 1px solid var(--sand-light);
    }

    .history-summary .total-sand {
      font-size: 2rem;
      font-weight: 300;
      color: var(--sand-dark);
    }

    .history-summary .total-label {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.2rem;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1rem;
      background: white;
      border-radius: 0.8rem;
      margin-bottom: 0.6rem;
      border: 1px solid var(--sand-light);
    }

    .history-item-left {
      flex: 1;
    }

    .history-item-name {
      font-size: 0.95rem;
      color: var(--text);
    }

    .history-item-date {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 0.2rem;
    }

    .history-item-sand {
      font-size: 1.2rem;
      color: var(--sand-dark);
      font-weight: 300;
      white-space: nowrap;
      margin-left: 1rem;
    }

    .history-item-sand .grain-unit {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .empty-history {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .history-item-delete {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.3rem 0.5rem;
      margin-left: 0.5rem;
      border-radius: 0.3rem;
      transition: all 0.2s;
    }

    .history-item-delete:hover {
      background: #f0e0d0;
      color: var(--accent);
    }

    /* --- Falling sand animation --- */
    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(60px); opacity: 0; }
    }

    .sand-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--sand);
      border-radius: 50%;
      animation: fall 1.2s linear infinite;
    }

    /* --- Responsive --- */
    @media (max-width: 360px) {
      .sand-count .number {
        font-size: 2rem;
      }
      .btn {
        padding: 0.7rem 1.5rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>砂粒のじかん</h1>
    <p>あなたの豊かな時間を砂粒で記録する</p>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="timer">砂時計</button>
      <button class="tab" data-tab="history">記録</button>
    </div>

    <!-- Timer Panel -->
    <div id="timer-panel" class="panel active">
      <div class="activity-input-area">
        <input
          type="text"
          class="activity-input"
          id="activity-name"
          placeholder="何をしますか？"
          maxlength="50"
        />
      </div>

      <div class="hourglass-container">
        <div class="hourglass">
          <svg viewBox="0 0 120 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Frame top -->
            <rect x="15" y="8" width="90" height="5" rx="2" fill="#a67c4a"/>
            <!-- Frame bottom -->
            <rect x="15" y="187" width="90" height="5" rx="2" fill="#a67c4a"/>

            <!-- Glass outline -->
            <path d="M25 13 C25 13, 25 80, 60 98 C95 80, 95 13, 95 13"
                  stroke="#c4b5a0" stroke-width="1.5" fill="rgba(255,255,255,0.3)"/>
            <path d="M25 192 C25 192, 25 120, 60 102 C95 120, 95 192, 95 192"
                  stroke="#c4b5a0" stroke-width="1.5" fill="rgba(255,255,255,0.3)"/>

            <!-- Top sand (decreases as timer runs) -->
            <clipPath id="top-clip">
              <path d="M27 15 C27 15, 27 78, 60 96 C93 78, 93 15, 93 15 Z"/>
            </clipPath>
            <rect id="top-sand" x="27" y="15" width="66" height="81"
                  fill="#d4a76a" clip-path="url(#top-clip)" opacity="0.7"/>

            <!-- Bottom sand (increases as timer runs) -->
            <clipPath id="bottom-clip">
              <path d="M27 190 C27 190, 27 122, 60 104 C93 122, 93 190, 93 190 Z"/>
            </clipPath>
            <rect id="bottom-sand" x="27" y="104" width="66" height="86"
                  fill="#d4a76a" clip-path="url(#bottom-clip)" opacity="0.7"/>

            <!-- Falling stream -->
            <line id="sand-stream" x1="60" y1="96" x2="60" y2="104"
                  stroke="#d4a76a" stroke-width="2" opacity="0" stroke-linecap="round"/>
          </svg>
        </div>

        <div class="sand-count">
          <span class="number" id="grain-count">0</span><span class="unit">粒</span>
        </div>
        <div class="elapsed-time" id="elapsed-time">00:00</div>
      </div>

      <div id="timer-controls" class="controls timer-state-idle">
        <div class="idle-controls">
          <button class="btn btn-start" id="btn-start">はじめる</button>
        </div>
        <div class="running-controls">
          <button class="btn btn-pause" id="btn-pause">一休み</button>
          <button class="btn btn-stop" id="btn-stop">おわる</button>
        </div>
        <div class="stopped-controls">
          <button class="btn btn-save" id="btn-save">記録する</button>
          <button class="btn btn-pause" id="btn-discard">やめる</button>
        </div>
      </div>
    </div>

    <!-- History Panel -->
    <div id="history-panel" class="panel">
      <div class="history-summary">
        <div class="total-sand" id="total-sand">0 粒</div>
        <div class="total-label">これまでの砂粒</div>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </main>

  <script>
    // --- State ---
    let timerState = 'idle'; // idle | running | paused | stopped
    let startTime = null;
    let pausedElapsed = 0;
    let timerInterval = null;
    let animationFrame = null;
    let currentElapsed = 0; // seconds

    // 1 grain = 10 seconds of activity
    const SECONDS_PER_GRAIN = 10;

    // --- DOM Elements ---
    const activityInput = document.getElementById('activity-name');
    const grainCountEl = document.getElementById('grain-count');
    const elapsedTimeEl = document.getElementById('elapsed-time');
    const timerControls = document.getElementById('timer-controls');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const btnSave = document.getElementById('btn-save');
    const btnDiscard = document.getElementById('btn-discard');
    const topSand = document.getElementById('top-sand');
    const bottomSand = document.getElementById('bottom-sand');
    const sandStream = document.getElementById('sand-stream');
    const historyList = document.getElementById('history-list');
    const totalSandEl = document.getElementById('total-sand');

    // --- Tabs ---
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-panel').classList.add('active');
        if (tab.dataset.tab === 'history') {
          renderHistory();
        }
      });
    });

    // --- Timer Logic ---
    function getElapsedSeconds() {
      if (timerState === 'running') {
        return pausedElapsed + (Date.now() - startTime) / 1000;
      }
      return currentElapsed;
    }

    function secondsToGrains(seconds) {
      return Math.floor(seconds / SECONDS_PER_GRAIN);
    }

    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = Math.floor(totalSeconds % 60);
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function updateDisplay() {
      const elapsed = getElapsedSeconds();
      currentElapsed = elapsed;
      const grains = secondsToGrains(elapsed);
      grainCountEl.textContent = grains;
      elapsedTimeEl.textContent = formatTime(elapsed);
      updateHourglass(elapsed);
    }

    function updateHourglass(elapsed) {
      // Cycle the hourglass every 5 minutes (300 seconds)
      const cycle = 300;
      const progress = (elapsed % cycle) / cycle;

      // Top sand shrinks from full
      const topHeight = 81 * (1 - progress);
      const topY = 15 + (81 - topHeight);
      topSand.setAttribute('y', topY);
      topSand.setAttribute('height', Math.max(0, topHeight));

      // Bottom sand grows from empty
      const bottomMaxHeight = 86;
      const bottomHeight = bottomMaxHeight * progress;
      const bottomY = 104 + (bottomMaxHeight - bottomHeight);
      bottomSand.setAttribute('y', bottomY);
      bottomSand.setAttribute('height', Math.max(0, bottomHeight));

      // Sand stream visible while running
      if (timerState === 'running') {
        sandStream.setAttribute('opacity', '0.8');
      } else {
        sandStream.setAttribute('opacity', '0');
      }
    }

    function tick() {
      updateDisplay();
      animationFrame = requestAnimationFrame(tick);
    }

    function setTimerState(state) {
      timerState = state;
      timerControls.className = 'controls timer-state-' + state;

      if (state === 'idle') {
        activityInput.disabled = false;
      } else {
        activityInput.disabled = true;
      }
    }

    // --- Button Handlers ---
    btnStart.addEventListener('click', () => {
      if (!activityInput.value.trim()) {
        activityInput.focus();
        activityInput.classList.add('shake');
        setTimeout(() => activityInput.classList.remove('shake'), 500);
        return;
      }
      startTime = Date.now();
      pausedElapsed = 0;
      currentElapsed = 0;
      setTimerState('running');
      tick();
    });

    btnPause.addEventListener('click', () => {
      if (timerState === 'running') {
        pausedElapsed += (Date.now() - startTime) / 1000;
        currentElapsed = pausedElapsed;
        cancelAnimationFrame(animationFrame);
        setTimerState('paused');
        updateDisplay();
      } else if (timerState === 'paused') {
        startTime = Date.now();
        setTimerState('running');
        tick();
      }
    });

    btnStop.addEventListener('click', () => {
      if (timerState === 'running') {
        pausedElapsed += (Date.now() - startTime) / 1000;
        currentElapsed = pausedElapsed;
      }
      cancelAnimationFrame(animationFrame);
      setTimerState('stopped');
      updateDisplay();
    });

    btnSave.addEventListener('click', () => {
      const grains = secondsToGrains(currentElapsed);
      if (grains === 0) {
        resetTimer();
        return;
      }

      const record = {
        id: Date.now(),
        name: activityInput.value.trim(),
        grains: grains,
        seconds: Math.floor(currentElapsed),
        date: new Date().toISOString(),
      };

      saveRecord(record);
      resetTimer();
    });

    btnDiscard.addEventListener('click', () => {
      resetTimer();
    });

    function resetTimer() {
      cancelAnimationFrame(animationFrame);
      startTime = null;
      pausedElapsed = 0;
      currentElapsed = 0;
      setTimerState('idle');
      grainCountEl.textContent = '0';
      elapsedTimeEl.textContent = '00:00';
      activityInput.value = '';
      updateHourglass(0);
    }

    // --- Storage ---
    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem('sand-records') || '[]');
      } catch {
        return [];
      }
    }

    function saveRecord(record) {
      const records = getRecords();
      records.unshift(record);
      localStorage.setItem('sand-records', JSON.stringify(records));
    }

    function deleteRecord(id) {
      const records = getRecords().filter(r => r.id !== id);
      localStorage.setItem('sand-records', JSON.stringify(records));
      renderHistory();
    }

    // --- History Rendering ---
    function renderHistory() {
      const records = getRecords();
      const totalGrains = records.reduce((sum, r) => sum + r.grains, 0);
      totalSandEl.textContent = totalGrains.toLocaleString() + ' 粒';

      if (records.length === 0) {
        historyList.innerHTML = '<li class="empty-history">まだ記録がありません。<br>砂時計を回してみましょう。</li>';
        return;
      }

      historyList.innerHTML = records.map(r => {
        const date = new Date(r.date);
        const dateStr = (date.getMonth() + 1) + '/' + date.getDate()
          + ' ' + String(date.getHours()).padStart(2, '0')
          + ':' + String(date.getMinutes()).padStart(2, '0');
        const timeStr = formatTime(r.seconds);
        return `
          <li class="history-item">
            <div class="history-item-left">
              <div class="history-item-name">${escapeHtml(r.name)}</div>
              <div class="history-item-date">${dateStr}  (${timeStr})</div>
            </div>
            <div class="history-item-sand">
              ${r.grains.toLocaleString()} <span class="grain-unit">粒</span>
            </div>
            <button class="history-item-delete" onclick="deleteRecord(${r.id})" title="削除">×</button>
          </li>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Init ---
    updateHourglass(0);
    renderHistory();
  </script>
</body>
</html>
